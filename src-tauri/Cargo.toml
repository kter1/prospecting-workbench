[package]
name = "prospecting-workbench"
version = "0.1.0"
description = "Free, local-first, evidence-backed AI prospecting workbench"
authors = ["Prospecting Workbench contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80.0"

[lib]
name = "prospecting_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros", "rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
scraper = "0.24"
thiserror = "2"
async-trait = "0.1"
psl = "2"

[dev-dependencies]
tempfile = "3"
